[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeside-devkit"
version = "0.1.0"
description = "Python helpers for the long-term Lakeside robotics dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "pillow",
  "pyproj",
  "open3d",
]

[tool.setuptools]
packages = ["lakeside", "lakeside.eval"]
